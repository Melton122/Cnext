<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cnext: The Complete Guide for Beginners &amp; Developers</title>
<style>
  @page { size: A4; margin: 1.8cm; }
  @media print {
    body { font-size: 10.5pt; }
    .page-break { page-break-before: always; }
    .no-break { page-break-inside: avoid; }
    nav, .toc { display: none; }
    details { display: none; }
  }
  :root {
    --brand: #2c3e50; --brand-2: #3498db; --accent: #27ae60;
    --text: #1f2d3d; --muted: #5c6b7a; --line: #dfe5eb; --code-bg: #f5f7fa;
    --tip: #eaf6ff; --warn: #fff6e0; --note: #f0f4f8; --ex: #eafaf0;
    --theory: #f4f0fa; --realworld: #fff6fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.7; color: var(--text); max-width: 920px; margin: 0 auto; padding: 40px 28px 120px; background: #fff; }
  h1 { font-size: 2.1em; margin: 1.2em 0 0.4em; color: var(--brand); font-weight: 700; }
  h2 { font-size: 1.55em; margin: 1.6em 0 0.4em; color: var(--brand); padding-bottom: 6px; border-bottom: 2px solid var(--line); font-weight: 650; }
  h3 { font-size: 1.22em; margin: 1.3em 0 0.3em; color: #24374a; font-weight: 600; }
  h4 { font-size: 1.05em; margin: 1em 0 0.2em; color: var(--muted); font-weight: 600; }
  p { margin: 0.65em 0; }
  strong { color: #0f1c2b; }
  ul, ol { margin: 0.5em 0 0.6em 1.7em; }
  li { margin: 0.32em 0; }
  a { color: var(--brand-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: "Consolas", "SFMono-Regular", Menlo, monospace; background: #eef1f6; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
  pre { background: var(--code-bg); border: 1px solid var(--line); border-left: 4px solid var(--brand-2); padding: 16px 18px; margin: 1em 0; overflow-x: auto; border-radius: 0 6px 6px 0; line-height: 1.55; }
  pre code { background: none; padding: 0; font-size: 0.86em; }
  table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.95em; }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--brand); color: #fff; font-weight: 600; }
  tr:nth-child(even) { background: #f7f9fb; }
  blockquote { border-left: 4px solid var(--brand-2); padding: 10px 18px; margin: 1em 0; background: var(--note); color: var(--text); }
  hr { border: none; border-top: 1.5px solid var(--line); margin: 2em 0; }
  .cover { text-align: center; padding: 110px 20px 60px; }
  .cover .kicker { letter-spacing: 4px; text-transform: uppercase; color: var(--brand-2); font-size: 0.9em; font-weight: 700; }
  .cover h1 { font-size: 3.4em; border: none; color: var(--brand); margin: 6px 0; }
  .cover .logo { font-size: 4.5em; margin: 8px 0 4px; color: var(--brand-2); }
  .cover .subtitle { font-size: 1.5em; color: var(--muted); margin: 8px 0 28px; }
  .cover .tagline { max-width: 560px; margin: 0 auto 46px; color: var(--text); font-size: 1.05em; }
  .cover .author { font-size: 1.15em; color: var(--brand); margin: 34px 0 4px; font-weight: 600; }
  .cover .edition { color: var(--muted); }
  .cover .badges { margin-top: 36px; }
  .badge { display: inline-block; background: var(--brand-2); color: #fff; border-radius: 20px; padding: 5px 14px; font-size: 0.85em; margin: 4px; }
  .toc { background: var(--note); border: 1px solid var(--line); border-radius: 8px; padding: 20px 26px; margin: 24px 0; }
  .toc h2 { border: none; margin-top: 0; }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li { padding: 3px 0; }
  .toc ul ul { padding-left: 18px; }
  .toc a { color: var(--text); }
  .toc .toc-part { font-weight: 700; color: var(--brand); margin: 10px 0 2px; }
  .callout { padding: 13px 18px; margin: 1.1em 0; border-radius: 6px; border-left: 4px solid; }
  .tip { background: var(--tip); border-color: var(--brand-2); }
  .note { background: var(--note); border-color: var(--muted); }
  .warning { background: var(--warn); border-color: #f39c12; }
  .key { background: var(--note); border-color: var(--brand); }
  .theory { background: var(--theory); border-color: #8e44ad; }
  .exercise { background: var(--ex); border-color: var(--accent); }
  .realworld { background: var(--realworld); border-color: #e84393; }
  .callout .cl { display: block; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.78em; margin-bottom: 5px; }
  .tip .cl { color: var(--brand-2); } .note .cl { color: var(--muted); } .warning .cl { color: #e67e22; }
  .key .cl { color: var(--brand); } .theory .cl { color: #8e44ad; }
  .exercise .cl { color: var(--accent); } .realworld .cl { color: #d81b60; }
  .part { text-align: center; padding: 64px 20px; margin: 2em 0; background: linear-gradient(135deg, #2c3e50, #34495e); color: #fff; border-radius: 10px; }
  .part h1 { color: #fff; border: none; margin: 0 0 6px; font-size: 2em; }
  .part p { color: #cfd8e3; font-size: 1.05em; }
  .part .partno { color: var(--brand-2); letter-spacing: 3px; font-size: 0.9em; font-weight: 700; }
  details.solution { margin: 0.3em 0 1.2em; border: 1px dashed var(--brand-2); border-radius: 6px; padding: 8px 14px; background: #fcfdff; }
  details.solution summary { cursor: pointer; color: var(--brand-2); font-weight: 600; }
  .tag { display: inline-block; font-size: 0.72em; font-weight: 700; padding: 2px 9px; border-radius: 12px; vertical-align: middle; }
  .tag.beg { background: #e8f5e9; color: #2e7d32; }
  .tag.int { background: #e3f2fd; color: #1565c0; }
  .tag.adv { background: #fce4ec; color: #c2185b; }
  .flow { display: block; text-align: center; font-family: monospace; margin: 1em 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
</style>
</head>
