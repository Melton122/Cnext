name: CI

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gcc make libcurl4-openssl-dev
      
    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gcc make curl
        gcc_path=$(find "$(brew --prefix gcc)/bin" -name 'gcc-[0-9]*' | head -n 1)
        mkdir -p "$RUNNER_TEMP/cnext-toolchain"
        ln -s "$gcc_path" "$RUNNER_TEMP/cnext-toolchain/gcc"
        echo "$RUNNER_TEMP/cnext-toolchain" >> "$GITHUB_PATH"
        echo "CC=gcc" >> "$GITHUB_ENV"
      
    - name: Install Make (Windows)
      if: runner.os == 'Windows'
      run: choco install make -y
      
    - name: Build
      run: make
      
    - name: Build (Debug)
      run: make clean && make DEBUG=1
      
    - name: Run Tests
      run: make test
      
    - name: Run Python Tests
      run: python tests/run_tests.py

    - name: Run C interoperability build tests
      run: |
        python tests/test_native_linking.py
        python tests/test_native_manifest.py

    - name: Run language and package contracts
      run: |
        python tests/test_language_contracts.py
        python tests/test_package_security.py
        python tests/test_allocators.py
        python tests/test_lifetimes.py
        python tests/test_optimizer_semantics.py

    - name: Run LSP Tests
      run: python tests/test_lsp.py

    - name: Self-hosting lexer parity
      run: make parity

    - name: Self-hosted compiler
      run: make self-build

    - name: Stage 1 bootstrap programs
      run: python tests/test_bootstrap_codegen.py --stage1 build/selfhost/stage1_exe${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: Stage 2 bootstrap programs
      run: python tests/test_bootstrap_codegen.py --stage1 build/selfhost/stage2_exe${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: Stage 1 language contracts
      env:
        CNEXT_EXE: build/selfhost/stage1_exe${{ runner.os == 'Windows' && '.exe' || '' }}
      run: |
        python tests/test_language_contracts.py
        python tests/test_lifetimes.py
        python tests/test_native_manifest.py

    - name: Stage 2 language contracts
      env:
        CNEXT_EXE: build/selfhost/stage2_exe${{ runner.os == 'Windows' && '.exe' || '' }}
      run: |
        python tests/test_language_contracts.py
        python tests/test_lifetimes.py
        python tests/test_native_manifest.py

    - name: Stage 1 optimizer and test command
      env:
        CNEXT_EXE: build/selfhost/stage1_exe${{ runner.os == 'Windows' && '.exe' || '' }}
      run: |
        python tests/test_optimizer_semantics.py
        python tests/test_selfhost_optimizer.py
        python tests/test_selfhost_test_runner.py

    - name: Stage 2 optimizer and test command
      env:
        CNEXT_EXE: build/selfhost/stage2_exe${{ runner.os == 'Windows' && '.exe' || '' }}
      run: |
        python tests/test_optimizer_semantics.py
        python tests/test_selfhost_optimizer.py
        python tests/test_selfhost_test_runner.py

    - name: Native and self-hosted behavior parity
      env:
        CNEXT_SELFHOST_EXE: build/selfhost/stage2_exe${{ runner.os == 'Windows' && '.exe' || '' }}
      run: python tests/test_compiler_parity.py

    - name: Stage 1 build and run CLI
      run: python tests/test_selfhost_cli.py --compiler build/selfhost/stage1_exe${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: Stage 2 build and run CLI
      run: python tests/test_selfhost_cli.py --compiler build/selfhost/stage2_exe${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: MSVC defer lowering and captures
      run: make msvc-defer-test

    - name: Performance Benchmark
      run: make bench

    - name: Code Coverage (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install -y lcov
        make coverage

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cnext-${{ matrix.os }}
        path: cnext*
        retention-days: 7
