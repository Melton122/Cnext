name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cnext-linux-x64
            ext: tar.gz
          - os: macos-26-intel
            artifact: cnext-macos-x64
            ext: tar.gz
          - os: macos-26
            artifact: cnext-macos-arm64
            ext: tar.gz
          - os: windows-latest
            artifact: cnext-windows-x64
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Verify Runner Architecture
      if: runner.os == 'macOS'
      shell: bash
      run: |
        actual="$(uname -m)"
        expected="${{ contains(matrix.artifact, 'arm64') && 'arm64' || 'x86_64' }}"
        echo "actual: $actual, expected: $expected"
        if [ "$actual" != "$expected" ]; then
          echo "::error::Runner arch mismatch: got $actual, expected $expected"
          exit 1
        fi

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y gcc make libcurl4-openssl-dev

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install make curl

    - name: Setup MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        # UCRT64 (MinGW target) — MSYS (POSIX) builds leave _WIN32 undefined,
        # making the compiler emit POSIX link flags (-lcurl) for user programs
        msystem: UCRT64
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-make
          zip

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: make

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: mingw32-make -j4

    - name: Package & Archive (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p dist
        cp cnext dist/
        cp -r include dist/ 2>/dev/null || true
        cp -r examples dist/ 2>/dev/null || true
        cp -r docs dist/ 2>/dev/null || true
        cp README.md dist/ 2>/dev/null || true
        cp LICENSE dist/ 2>/dev/null || true
        cp install.sh dist/ 2>/dev/null || true
        chmod +x dist/install.sh 2>/dev/null || true
        cd dist
        tar -czf ../${{ matrix.artifact }}-${{ github.ref_name }}.${{ matrix.ext }} *

    - name: Package & Archive (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        mkdir -p dist
        cp cnext.exe dist/
        cp -r include dist/ 2>/dev/null || true
        cp -r examples dist/ 2>/dev/null || true
        cp -r docs dist/ 2>/dev/null || true
        cp README.md dist/ 2>/dev/null || true
        cp LICENSE dist/ 2>/dev/null || true
        cd dist
        zip -r ../${{ matrix.artifact }}-${{ github.ref_name }}.${{ matrix.ext }} *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}-*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download All Artifacts
      uses: actions/download-artifact@v4

    - name: Generate Checksums
      run: |
        find cnext-* -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; > checksums.txt
        cat checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          cnext-linux-x64/*.tar.gz
          cnext-macos-x64/*.tar.gz
          cnext-macos-arm64/*.tar.gz
          cnext-windows-x64/*.zip
          checksums.txt

  smoke-test:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest

    steps:
    - name: Smoke Test Installer and Binary (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -e
        sudo apt-get update && sudo apt-get install -y gcc make
        curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh" | bash
        version_out="$(cnext version)"
        echo "$version_out"
        expected="${{ github.ref_name }}"
        expected="${expected#v}"
        if ! echo "$version_out" | grep -q "$expected"; then
          echo "::error::Installed version $version_out does not match release $expected"
          exit 1
        fi
        mkdir -p /tmp/cnext_smoke && cd /tmp/cnext_smoke
        printf 'main {\n    printin("smoke")\n}\n' > smoke.cn
        set +e
        cnext build smoke.cn -o smoke 2>build_err.txt
        rc=$?
        set -e
        if [ $rc -ne 0 ]; then
          echo "::error::build rc=$rc: $(tail -5 build_err.txt)"
          exit $rc
        fi
        run_out="$(./smoke)"
        echo "$run_out"
        if [ "$run_out" != "smoke" ]; then
          echo "::error::Installed cnext could not build/run a hello program ($run_out)"
          exit 1
        fi

    - name: Smoke Test Installer and Binary (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        choco install mingw -y --no-progress | Out-Null
        $env:PATH = "C:\tools\mingw64\bin;$env:PATH"
        $url = "https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1"
        iwr -useb $url | iex
        $expected = "${{ github.ref_name }}".TrimStart("v")
        $versionOut = & "$env:LOCALAPPDATA\Cnext\bin\cnext.exe" version
        Write-Host $versionOut
        if ($versionOut -notmatch $expected) {
          Write-Error "Installed version $versionOut does not match release $expected"
          exit 1
        }
        Set-Location $env:TEMP
        "main {`n    printin(`"smoke`")`n}" | Out-File -Encoding ascii smoke.cn
        & "$env:LOCALAPPDATA\Cnext\bin\cnext.exe" build smoke.cn -o smoke.exe
        $runOut = & "$env:TEMP\smoke.exe"
        Write-Host $runOut
        if ($runOut -ne "smoke") {
          Write-Error "Installed cnext could not build/run a hello program ($runOut)"
          exit 1
        }
