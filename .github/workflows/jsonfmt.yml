name: jsonfmt app CI

on:
  push:
    paths:
      - "apps/jsonfmt/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/jsonfmt.yml"
  pull_request:
    paths:
      - "apps/jsonfmt/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/jsonfmt.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MSYS2 toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make

      - name: Build compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -j2

      - name: Test jsonfmt (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C apps/jsonfmt test

      - name: Build compiler (Unix)
        if: runner.os != 'Windows'
        run: make -j2

      - name: Test jsonfmt (Unix)
        if: runner.os != 'Windows'
        run: make -C apps/jsonfmt test
